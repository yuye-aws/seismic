name =          "msmarco_v2_cocondenser"
title =         "Seismic on Cocondenser embeddings of MS MARCO v2"
description =   "Seismic on Cocondenser embeddings of MS MARCO v2 dataset"
dataset =       "Cocondenser on MS MARCO v2"
# compile-command = "cargo build" # Compile in debug mode? default is release mode
# build-command = "./target/release/build_inverted_index"
# query-command = "./target/debug/perf_inverted_index"

[settings]
k =             10
n-runs =        1       # Number of runs. PLEASE think carefully how increasing 
                        # this may influence your query time
# NUMA =        ""      # "numactl --physcpubind='0-15' --localalloc"    # Is the machine NUMA and need to prepend "numactl --physcpubind='0-15' --localalloc" to query command? Otherwise comment this!
build =         false  # Need to build the index or the index is already built?
metric =        "RR@10"

[folder] 
data =          "/home/ec2-user/yuye/sparse_datasets/msmarco_v2_converted/data"
index =         "/home/ec2-user/yuye/sparse_datasets/msmarco_v2_converted/indexes"
qrels_path =    "/home/ec2-user/yuye/sparse_datasets/msmarco_v2_converted/qrels.msmarco_v2.tsv"
experiment =    "."     # stdout and stderr here of running the experiment is saved here. in a specific subfolder for the current execution

[filename]
dataset =       "documents.bin"
queries =       "queries.bin"
groundtruth =   "groundtruth.tsv"
doc_ids =       "doc_ids.npy"
query_ids =     "queries_ids.npy"
index =         "msmarco_v2_cocondenser_baseline"

[indexing_parameters]
n-postings =            60000
centroid-fraction =     0.1
summary-energy =        0.4
knn =                   0
clustering-algorithm =  "random-kmeans-inverted-index-approx" # Possible options are "random-kmeans", "random-kmeans-inverted-index", "random-kmeans-inverted-index-approx"
kmeans-doc-cut =        15    # needed by "random-kmeans-inverted-index" and "random-kmeans-inverted-index-approx"
kmeans-pruning-factor = 0.005 # Only used by random-kmeans-inverted-index

[query]
    [query.recall_90]
    query-cut =         5
    heap-factor =       1.0

    [query.recall_91]
    query-cut =         3
    heap-factor =       0.9
    
    [query.recall_92]
    query-cut =         7
    heap-factor =       1.0

    [query.recall_93]
    query-cut =         4
    heap-factor =       0.9

    [query.recall_94]
    query-cut =         5
    heap-factor =       0.9

    [query.recall_95]
    query-cut =         5
    heap-factor =       0.8

    [query.recall_96]
    query-cut =         7
    heap-factor =       0.8
    
    [query.recall_97]
    query-cut =         7
    heap-factor =       0.7